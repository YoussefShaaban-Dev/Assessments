<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Counter</title>
</head>

<body>
    <h1 id="counter"></h1>
    <div class="buttons">
        <button id="btnPlus" onclick="increaseCount()">+</button>
        <button id="btnMinus" onclick="decreaseCount()">-</button>
        <button id="btnReset" onclick="resetCount()">Reset</button>
        <button id="btnSave" onclick="saveCount()">Save</button>
        <button id="btnLoad" onclick="loadCount()">Load</button>
    </div>
    <p id="message"></p>
    <script src="script.js" defer></script>
</body>

</html>

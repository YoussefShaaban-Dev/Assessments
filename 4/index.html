<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Counter</title>
</head>

<body>
    <h1>To-Do List</h1>
    <div>
        <input id="txtItem" type="text" placeholder="To-Do Item" />
        <input id="btnAdd" type="button" onclick="addItem()" value="Add" />
    </div>
    <ul id="list"></ul>
    <button onclick="clearAll()">Clear All</button>
    <p id="message"></p>
    <script src="script.js" defer></script>
</body>

</html>

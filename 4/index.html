<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="..\assets\font-awesome-4.7.0\css\font-awesome.css">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <img class="bg-img" src="assets/bg.jpg" />
        <div class="bg-grd"></div>
    </header>

    <main>
        <div>
            <div class="d-flex v-center s-between header-title">
                <h1 class="title">To Do</h1>
                <i class="fa fa-moon-o lightdark-icon" onclick="switchLightDark()"></i>
            </div>

            <div class="light-dark panel mb-10 item">
                <div id="newItemCheck" class="btn-check btn" onclick="switchNewItem()">
                    <i class="fa fa-check"></i>
                </div>
                <input id="txtItem" type="text" placeholder="To-Do Item" />
                <i class="fa fa-times" onclick="clearNewItem()"></i>
            </div>

            <div class="light-dark panel items">
                <ul id="list" class="items-list active-only"></ul>
                <div class="footer">
                    <div>
                        <span id="leftCount"></span> items left
                    </div>
                    <div>
                        <button class="btn2 btn-filter all" onclick="displayItems('all')">All</button>
                        <button class="btn2 btn-filter active" onclick="displayItems('active')">Active</button>
                        <button class="btn2 btn-filter completed" onclick="displayItems('completed')">Completed</button>
                    </div>
                    <div>
                        <button class="btn2 btn-clear" onclick="clearCompleted()">Clear Completed</button>
                        <button class="btn2 btn-clear" onclick="clearAll()">Clear All</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <p id="message"></p>
    <script src="script.js" defer></script>
</body>

</html>
